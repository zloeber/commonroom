[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "commonroom"
version = "0.1.0"
description = "Local-first shared workspace for humans and AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[project.scripts]
commonroom = "commonroom.cli:main"

[project.entry-points."commonroom.transports"]
loopback = "commonroom.transport.loopback:plugin"
tailcat = "commonroom.transport.plugins.tailcat:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/commonroom"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
